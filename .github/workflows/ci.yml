name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root_test
          MARIADB_DATABASE: mxis_test
          MARIADB_USER: mxis_test
          MARIADB_PASSWORD: mxis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run tests
        env:
          TEST_DB_URL: jdbc:mariadb://127.0.0.1:3306/mxis_test
          TEST_DB_USERNAME: mxis_test
          TEST_DB_PASSWORD: mxis_test
        run: ./gradlew --no-daemon clean test integrationTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
